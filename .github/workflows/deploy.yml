name: Deploy to VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          echo "API_ID=${{ secrets.API_ID }}" >> $GITHUB_ENV
          echo "API_HASH=${{ secrets.API_HASH }}" >> $GITHUB_ENV
          echo "BOT_TOKEN=${{ secrets.BOT_TOKEN }}" >> $GITHUB_ENV

      - name: Ensure remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: mkdir -p ${{ secrets.DEPLOY_PATH }}

      - name: Copy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "bot.py,requirements.txt,tg-random.service"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Setup and restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: API_ID,API_HASH,BOT_TOKEN
          command_timeout: 15m
          script_stop: false
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            python3 -m venv .venv 2>/dev/null || true
            . .venv/bin/activate
            pip install -r requirements.txt -q
            printf 'API_ID=%s\nAPI_HASH=%s\nBOT_TOKEN=%s\n' "$API_ID" "$API_HASH" "$BOT_TOKEN" > .env
            (pkill -f "python.*bot.py" 2>/dev/null || true)
            nohup .venv/bin/python bot.py > bot.log 2>&1 &
            disown
            sleep 5
            echo "Bot started"
